apiVersion: batch/v1
kind: Job
metadata:
  generateName: cert-gener-
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
spec:
  template:
    spec:
      securityContext:
         runAsUser: RunAsAny
      containers:
        - image: registry.redhat.io/openshift4/ose-cli:v4.14
          command:
            - /bin/bash
            - -c
            - |
              mkdir /home/certs
              cd /home/certs
              yum install -y java
              ns='amq-broker'
              export storepass='changeme'
              export srcstorepass='changeme'
              export deststorepass='changeme'
              export keyStorePassword='changme'
              export trustStorePassword='changeme'
              oc login https://api.cluster-tq9x2.dynamic.redhatworkshops.io:6443 --token='eyJhbGciOiJSUzI1NiIsImtpZCI6InFKcU5pcUsxR2RnWTJWTklZc1cxc1pBRk4wSGVkbUN2czVXejlaUEExSjgifQ..E7gZ7iDhZg6ZIdLMhLGYCerCZI0UJR3mFIlEjEoJdKlemTQb9mi-0Sohxj0JiGrOod09TaWerFX9UlmHneOjJnVjs87-u8iDTsJRZ84ycOW86SdXm4UzatBdbEP-uYKE_xIv7KGN9mwQH7u57OoaeezsGUtOUmAtZ6InLBaOwT7Bwihg3Pcb2w01dahPO45VXX3_Dvp3ugXST7LEVKqgxmS-NRHhS1ahXqUbhaMJdeXXHJ7JTHId_xA-_u83AoprPx3GSqJZmabpmaiLPD6Xh9vOdKAHa5LMdLc6go6foxEsNj2Vzp3rGZklp3dD73W22btotx7Tn4BREveddoLJnZMcRHbqf46knaiCkPGY8xqDGlhjhqwaNNy4H9-N9f5wfNs6yACFegCHIZFYeMQdEVAIbJfup8Xi0bE46eDI96v-Y8JpfcKVpc0WtZWH8VwnOelhbmywtfMoevIIWVE7veOyHxlQsQP5_rXfE4ahFrzmb-KzgoVtHjmPvWjvqov_TAITUTjgDq-QkEnNWvWo4h1OzVYRqOccmL-LJcMQruQ0NC0tZ-LQmnZI-5AL9ZQWazTHsyhqbVdsgy_FVeCU_pSNzO07kn_vhKsAKqY46HiwLt_MjnQiDbF7jWxqicyrB1xMmZCjg9UuvyhtkJwlVTkGucWqmYG61D_HuoIAUCI' --insecure-skip-tls-verify=true
              cert=$(oc get secret -n openshift-ingress | awk '{print $1}' | grep -iv name | grep -i ingress)
              oc extract secret/$cert -n openshift-ingress --to=/tmp
              openssl pkcs12 -export -in /tmp/tls.crt -inkey /tmp/tls.key -out keystore.p12 -password pass:$keyStorePassword
              keytool -importkeystore -srckeystore keystore.p12  -srcstoretype PKCS12 -destkeystore broker.ks -deststoretype JKS -srcstorepass $srcstorepass -deststorepass $deststorepass
              keytool -import -alias broker -keystore client.ts -file /tmp/tls.crt -storepass $storepass -noprompt
              oc create secret generic my-tls-secret --from-file=broker.ks=broker.ks --from-file=client.ts=client.ts --from-literal=keyStorePassword=$keyStorePassword --from-literal=trustStorePassword=$trustStorePassword -n $ns
              oc create secret generic my-tls-secret-console --from-file=broker.ks=broker.ks --from-file=client.ts=client.ts --from-literal=keyStorePassword=$keyStorePassword --from-literal=trustStorePassword=$trustStorePassword -n $ns
          imagePullPolicy: Always
          name: certificate-generate
          env:
            - name: SLEEP
              value: "20"
      dnsPolicy: ClusterFirst
      restartPolicy: OnFailure
      terminationGracePeriodSeconds: 30
