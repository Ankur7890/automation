apiVersion: batch/v1
kind: Job
metadata:
  generateName: cert-gener-
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
spec:
  template:
    spec:
      serviceAccountName: amq-broker-token
      containers:
        - image: registry.redhat.io/openshift4/ose-cli:v4.14
          command:
            - /bin/bash
            - -c
            - |
              cluster='https://api.cluster-tq9x2.dynamic.redhatworkshops.io:6443'
              token='eyJhbGciOiJSUzI1NiIsImtpZCI6InFKcU5pcUsxR2RnWTJWTklZc1cxc1pBRk4wSGVkbUN2czVXejlaUEExSjgifQ..KG1WMClfF107Bw7qSc01f2XZ-NfPV2kq9zH-dbXiIGBO5bheXwH0afeXaN36Uv6kEFgcAUv8Zhsaa04IjPleVyGVWtqFUrjdzBg8a5rOgDgYXxEmuIeRnjHoe5m_9CcoGeM_bdCmH0yPNuOewGndnUVAt98GEBiRnbRTSaIifoqna972LNsJiUxAEvc-A-bbXfn4gXfvHoAidZFCF1C0hm6ii3ZTgltbB6eg82dW-NPxb2_CgYBQYgvYXZ_BSLQG9EX3SwVz0qxmreNEX6xs3hDIQQvNSQ3Ce8w1EReWFT0frtOUD7_CJ4gUgWuml_w-Gh2n_bmHTvSem35VPvo0jXFfm2LCbOdctsNpd7JvgYFUwyBjMjT9ntsWj41t3gZ8gRpt-yJxAUL4d3yXhRaohiruZI_QhzJLHiuof4-yhUzK9F317uOIXJOMIbiUSzGtGbDYEH1YRRL6GA_uosR2eKcGZkt_NAiVk4rJ3J3NGS0TCUaesvZmfz1lRsqVoCwGg-S6Ae9dS8Z1wDsGbQS8aY-G1LBEArbYHDWuCfDwXkcR9P5OCG9SUtfiKsS53jmNGM9IQXKC-LDpO1zzso2YejRDjTT_AI55aX24eK-T40rMblSUcFxl9jQRn9ssIKLrKbeSrm3d1EdcTwF7fHPGJZmoVPcPUx0dAzkr0QHFYFI'
              oc login $cluster --token=$token --insecure-skip-tls-verify=true
              yum install -y java
              ns='amq-broker'
              pass=$(echo 'Y2hhbmdlbWUK' | base64 -d)
              cert=$(oc get secret -n openshift-ingress | awk '{print $1}' | grep -iv name | grep -i ingress)
              oc extract secret/$cert -n openshift-ingress --to=/tmp
              openssl pkcs12 -export -in /tmp/tls.crt -inkey /tmp/tls.key -out keystore.p12 -password pass:$pass
              keytool -importkeystore -srckeystore keystore.p12  -srcstoretype PKCS12 -destkeystore broker.ks -deststoretype JKS -srcstorepass $pass -deststorepass $pass
              keytool -import -alias broker -keystore client.ts -file /tmp/tls.crt -storepass $pass -noprompt
              oc create secret generic my-tls-secret --from-file=broker.ks=broker.ks --from-file=client.ts=client.ts --from-literal=keyStorePassword=$pass --from-literal=trustStorePassword=$pass -n $ns
              oc create secret generic my-tls-secret-console --from-file=broker.ks=broker.ks --from-file=client.ts=client.ts --from-literal=keyStorePassword=$pass --from-literal=trustStorePassword=$pass -n $ns
          imagePullPolicy: Always
          name: certificate-generate
          env:
            - name: SLEEP
              value: "20"
      dnsPolicy: ClusterFirst
      restartPolicy: OnFailure
      terminationGracePeriodSeconds: 30

