apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jaeger
spec:
  destination:
    name: ''
    namespace: openshift-distributed-tracing
    server: 'https://kubernetes.default.svc'
  source:
    path: clusteroperator/jaeger/overlays/int
    repoURL: 'https://github.com/Ankur7890/automation.git'
    targetRevision: main
  sources: []
  project: default
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
